[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openvariance"
version = "0.1.0"
description = "Open source FP&A variance analysis: explain why your numbers moved, with reconciled driver bridges, three-statement forecasts, and Excel output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Carson Jones" }]
keywords = [
  "fpa",
  "fp&a",
  "variance-analysis",
  "budget-vs-actual",
  "financial-modeling",
  "forecasting",
  "three-statement-model",
  "sec-edgar",
  "xbrl",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Typing :: Typed",
]
dependencies = ["openpyxl>=3.1", "mcp>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "formulas>=1.2.8"]

[project.scripts]
openvariance = "openvariance.cli:main"

[project.urls]
Homepage = "https://github.com/wavebyrd/openvariance"
Issues = "https://github.com/wavebyrd/openvariance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openvariance"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "AGENTS.md", "llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM108"]  # formatter owns line length

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["openvariance"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl.*", "mcp.*"]
ignore_missing_imports = true
